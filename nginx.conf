user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    include /etc/nginx/conf.d/*.conf;  # Asegura que carga las configuraciones de los servidores

    server {
        listen 80;

        server_name localhost;

        location / {
            proxy_pass http://fastapi-chatbot:8000;  # Apunta al servicio FastAPI (usando el nombre del servicio definido en docker-compose)
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Salud check para nginx
        location /health {
            proxy_pass http://fastapi-chatbot:8000/health;
        }

        # Manejar errores (opcional)
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}

