services:
  fastapi-chatbot:
    build:
      context: .
      dockerfile: Dockerfile.fastapi  # Se mantiene el nombre del archivo, pero apunta al Dockerfile de FastAPI
    container_name: fastapi-chatbot
    volumes:
      - ./app:/app
    ports:
      - "8000:8000"  # Cambiamos el puerto a 8000, que es el estándar para FastAPI
    depends_on:
      chromadb:
        condition: service_started
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    networks:
      - chatbot-network
    command: ["gunicorn", "-w", "4", "-k", "uvicorn.workers.UvicornWorker", "main:app", "--bind", "0.0.0.0:8000"]


  chromadb:
    build:
      context: .
      dockerfile: Dockerfile.chroma
    container_name: chromadb
    volumes:
      - chromadb_data:/chroma
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/heartbeat"]
      interval: 30s
      timeout: 30s
      retries: 5
    networks:
      - chatbot-network

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./conf.d/default.conf:/etc/nginx/conf.d/default.conf
        #      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - fastapi-chatbot
    networks:
      - chatbot-network

  opensearch:
    image: opensearchproject/opensearch:2.10.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"  # Ajusta memoria según tu sistema
      - "DISABLE_SECURITY_PLUGIN=true"  # Desactiva seguridad para desarrollo
    ports:
      - "9200:9200"  # Puerto HTTP
      - "9600:9600"  # Puerto de administración
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 5

  redis:
    image: redis:7.0
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          memory: 2G  # Suficiente para TinyLlama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 30s
      start_period: 2m
    networks:
      - chatbot-network

volumes:
  chromadb_data:
  opensearch_data:
  redis_data:
  ollama_data:

networks:
  chatbot-network:
    driver: bridge

